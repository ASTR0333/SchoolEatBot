[project]
name = "school-eat-max-bot"
version = "0.1.0"
description = "MAX bot for collecting school cafeteria orders"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.12.15",
    "aiosqlite==0.21.0",
    "apscheduler==3.11.0",
    "openpyxl==3.1.5",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.43",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
