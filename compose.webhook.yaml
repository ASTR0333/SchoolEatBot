services:
  bot:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bot:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
